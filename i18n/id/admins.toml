# Admin help prose: overview plus per-section bodies.
# Structure (order, labels) stays in admins.py; only prose lives here.
# The Who section composes shared permission constants, so it stays in
# Python; everything below is static prose. Mini-markup only: `code`
# and *bold*, balanced and unnested.

[help]
overview = "Mempromosikan dan mendemosi staf, mentransfer kepemilikan, dan mengelola permintaan promosi se-federasi."

[help.commands]
body = """
`/tcpromote` (alias: `/tcp`)
`/tcdemote` (alias: `/tcd`)
`/transferowner` (alias: `/tfowner`)
`/tcpromoterequests` (alias: `/tcreqs`)
`/tcpromotelist` (alias: `/tcplist`)"""

[help.who]
body = """*/tcpromote*, */tcdemote*, */tcpromotelist*: Founder dan Admin.
*/transferowner*: {perm}
*/tcpromoterequests*: siapa pun (membuat permintaan sendiri ke Founder)."""

[help.roles]
body = """
Founder (peringkat 4) > Admin (peringkat 3) > Developer (peringkat 2) > Tester (peringkat 1)

Kamu tidak bisa mempromosikan pengguna ke peringkat yang sama atau lebih tinggi darimu. Admin yang mempromosikan seseorang ke Admin mengantrekan permintaan ke Founder."""

[help.promote]
body = """
Memberi peran ke pengguna. Tanpa argumen peran, menu tombol inline akan muncul.

*Pemakaian:* `/tcpromote <target> [admin|developer|tester]`
- Founder bisa promosi ke peran mana pun langsung.
- Admin bisa promosi ke Developer atau Tester langsung; promosi ke Admin mengirim permintaan tertunda ke Founder untuk disetujui."""

[help.demote]
body = """
Mencabut peran pengguna. Tombol konfirmasi muncul sebelum tindakan dijalankan.

*Pemakaian:* `/tcdemote <target>`
- Founder bisa mendemosi peran mana pun.
- Admin hanya bisa mendemosi Developer atau Tester.
- Saat pengguna berperan di-ban atau di-kick, perannya otomatis dicabut dan mereka diberi tahu lewat DM."""

[help.transferowner]
body = """
Mentransfer kepemilikan federasi ke pengguna lain. Founder saat ini turun jadi Admin. Hanya Founder.

*Pemakaian:* `/transferowner <target>`"""

[help.examples]
body = """
`/tcpromote @username developer`
`/tcpromote 123456789`: menampilkan menu pilihan peran
`/tcdemote @username`
`/transferowner @newowner`
`/tcpromoterequests`: minta promosi ke Admin
`/tcplist`: daftar permintaan promosi tertunda"""

