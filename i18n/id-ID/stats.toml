# Stats help prose: overview plus per-section bodies.
# Structure (order, labels) stays in stats.py; only prose lives here.
# Mini-markup only: `code` and *bold*, balanced and unnested.

[help]
overview = "Lihat ringkasan federasi live: Owner, staf, pengguna, ban aktif, dan grup terhubung, dengan menu drill-down untuk tiap bagian."

[help.commands]
body = "`/tcstats` `/tcs`"

[help.what]
body = "Menampilkan ringkasan federasi live: Owner, total staf per peran, jumlah pengguna yang di-cache, ban federasi aktif, dan chat terhubung."

[help.drills]
title = "Rincian"
body = """
*Daftar Staf*: Owner, Admin, Developer, dan Moderator, masing dengan mention di bawah garis pemisah.
*Pengguna*: tabel semua pengguna yang di-cache per halaman dengan ID, username, dan kedua tanggal aktivitas di barisnya (hanya Owner, tombol dan tabelnya disembunyikan dari yang lain).
*Chat Terhubung*: tabel semua grup aktif per halaman dengan ID, penghubung, dan tanggal connect.
*Ban Pengguna*: tabel semua ban aktif per halaman dengan ID, alasan, dan tanggal, plus pintasan *Cari* untuk mencari pengguna via nama atau ID.

Tiap tabel dihalaman dengan *Sebelumnya* dan *Berikutnya* serta diakhiri tombol *Kembali* ke ringkasan utama."""

[help.examples]
body = """
`/tcstats`
`/tcs`"""

[error]
user_not_found = "Pengguna tidak ditemukan di halaman ini."
group_not_found = "Grup tidak ditemukan di halaman ini."
ban_not_found = "Catatan ban tidak ditemukan di halaman ini."
result_unavailable = "Hasil sudah tidak tersedia."
access_retry = "Tidak bisa memverifikasi aksesmu sekarang. Coba lagi sebentar."
staff_only = "Panel ini khusus untuk TC Staff."
db_fail = "Tidak bisa memuat data. Database tidak terjangkau, coba lagi sebentar."

# Runtime strings for stats views (stats_flow.py). All render rich HTML
# except button labels (plain). Placeholders as documented per key.

[button]
roster = "Daftar Staf"
bans = "Ban Pengguna"
chats = "Chat Terhubung"
users = "Pengguna"

[main]
title = "{community} *Statistik*"
owner_unset = "Belum diatur"
degraded = "Sebagian angka gagal dimuat; nilai yang terpengaruh ditandai tidak tersedia."
unavailable = "Tidak tersedia"
owner_unavailable = "Tidak dapat diverifikasi"

[main.breakdown]
admin = "Admin"
developer = "Dev"
moderator = "Moderator"

# Baris ringkasan dua kolom. Nilainya dibangun di Python dan disisipkan mentah.
[main.table]
owner = "Owner"
staff = "Staf"
users = "Pengguna terlacak"
bans = "Ban aktif"
chats = "Chat Terhubung"

# Header kolom untuk tampilan tabel. Teks polos, tanpa placeholder.
[table]
user = "Pengguna"
id = "ID"
username = "Username"
first_seen = "Pertama terlihat"
last_seen = "Terakhir terlihat"
group = "Grup"
connected_by = "Dihubungkan oleh"
reason = "Alasan"
ban = "ID Ban"
date = "Tanggal"
time = "Waktu"

[roster]
title = "*Daftar Staf* - {community}"
owner = "Owner"
admins = "Admin"
developers = "Developer"
moderators = "Moderator"
section = "{label}"
member = "{user}"
