# Help index prose for help.py itself: the topic-list header.
# Structure stays in help.py; only prose lives here.
# Placeholders: {title} carries pre-formatted heading markup from code,
# {divider} is a rich rule and {quote} is a plain block quotation.

[index]
title = "Bantuan {botname}"
body = """{title}
{divider}
{quote}"""
guidance = "Pilih modul di bawah ↴ untuk membaca ringkasan dan perintahnya, atau pakai /help module untuk langsung ke topik."

# Runtime strings (help.py). [error] sends plain; [note]/[module]/
# [section]/[not_found] render as rich HTML. Placeholders: {title}/
# {prefixes}/{query}/{hint} pre-formatted fragments, {overview}/
# {content} pre-rendered help prose, {divider} a rich rule and
# {list} a rich bulleted block.

[error]
topic_not_found = "Topik tidak ditemukan."
section_not_found = "Bagian tidak ditemukan."
invalid_section = "Bagian tidak valid."

[module]
title = "Bantuan untuk {name}"
body = """{title}
{divider}
{overview}
{divider}"""

[section]
body = """{title}
{divider}
{list}"""

[not_found]
body = "Modul {query} tidak ditemukan.{hint}"
hint = "\n\nMungkin maksudmu: {suggestions}?"

[group]
alert = "Jalankan /help di grup ini untuk menelusuri semua modul dan perintah."
