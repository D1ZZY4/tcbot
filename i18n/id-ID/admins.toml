# Admin help prose: overview plus per-section bodies.
# Structure (order, labels) stays in admins.py; only prose lives here.
# The Who section composes shared permission constants, so it stays in
# Python; everything below is static prose. Mini-markup only: `code`
# and *bold*, balanced and unnested.

[help]
overview = "Mempromosikan dan mendemosi staf, mentransfer kepemilikan, dan mengelola permintaan promosi se-federasi."

[help.commands]
body = """
`/tcpromote` `/tcp`
`/tcsetrole`
`/tcdemote` `/tcd`
`/transferowner` `/tfowner`
`/tcpromoterequests` `/tcreqs`
`/tcpromotelist` `/tcplist`"""

[help.who]
body = """*/tcpromote*, */tcsetrole*, */tcdemote*, */tcpromotelist*: Owner dan Admin.
*/transferowner*: {perm}
*/tcpromoterequests*: siapa pun (membuat permintaan sendiri ke Owner)."""

[help.roles]
title = "Hierarki Peran"
body = """
*Owner* (peringkat 4) ➛ *Admin* (peringkat 3) ➛ *Developer* (peringkat 2) ➛ *Moderator* (peringkat 1)

Kamu tidak bisa mempromosikan pengguna ke peringkat yang sama atau lebih tinggi darimu. Admin yang mempromosikan seseorang ke Admin mengantrekan permintaan ke Owner."""

[help.promote]
body = """
Memberi peran ke pengguna. Tanpa argumen peran, menu tombol inline akan muncul.

*Pemakaian:* `/tcpromote <target> [admin|developer|moderator]`
- Owner bisa promosi ke peran mana pun langsung.
- Admin bisa promosi ke Developer atau Moderator langsung; promosi ke Admin mengirim permintaan tertunda ke Owner untuk disetujui."""

[help.demote]
body = """
Mencabut peran pengguna. Tombol konfirmasi muncul sebelum tindakan dijalankan.

*Pemakaian:* `/tcdemote <target>`
- Owner bisa mendemosi peran mana pun.
- Admin hanya bisa mendemosi Developer atau Moderator.
- Saat pengguna berperan di-ban atau di-kick, perannya dicabut dan mereka diberi tahu lewat DM."""

[help.setrole]
body = """
Mengubah peran staf yang sudah ada tanpa mencabutnya. Pemilih hanya menampilkan peran yang boleh kamu berikan, kecuali peran yang sedang dipegang - jadi Admin ke Moderator atau Moderator ke Developer bisa dilakukan.

*Pemakaian:* `/tcsetrole <target>`
- Owner bisa memindahkan staf antar Admin, Developer, dan Moderator.
- Admin bisa memindahkan staf antar Developer dan Moderator.
- Owner tidak pernah bisa menjadi target, dan pengguna yang di-ban tidak bisa memegang peran."""

[help.transferowner]
body = """
Mentransfer kepemilikan federasi ke pengguna lain. Owner saat ini turun jadi Admin. Hanya Owner.

*Pemakaian:* `/transferowner <target>`"""

[help.examples]
body = """
`/tcpromote @username developer`
`/tcpromote 123456789` menampilkan menu pilihan peran
`/tcsetrole @username moderator` mengubah peran yang sudah ada
`/tcdemote @username`
`/transferowner @newowner`
`/tcpromoterequests` minta promosi ke Admin
`/tcplist` daftar permintaan promosi tertunda"""

