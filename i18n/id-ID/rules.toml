# Fitur aturan: dialog editor, menu publik, dan acknowledgement.
# Template tetap apa adanya; mesin escape rich HTML saat render.

[editor]
categories = "Kategori"
items = "Item"
panel = "Editor aturan\n*Set:* {name}\n*Status:* {status}\n*Item:* {count}"
ask_category = "Kirim judul kategori."
ask_title = "Kirim judul item."
ask_body = "Kirim isi item (teks polos)."
ask_url = "Kirim URL referensi http(s) opsional, atau - untuk lewati."
bad_title = "Judul harus 1-{limit} karakter."
bad_body = "Isi harus 1-{limit} karakter."
bad_url = "URL referensi harus tautan http(s) dengan panjang maksimal 500 karakter."
confirm_discard = "Buang draf saat ini? Aturan yang sudah terbit tidak berubah."
discarded = "Draf dibuang."
cancelled = "Editor aturan ditutup."
unexpected = "Gunakan tombol di bawah untuk menyunting, atau tutup editor."
open_pm = "Buka chat pribadi dengan saya untuk melanjutkan."
ask_rename = "Kirim judul kategori yang baru."
language = "Bahasa aturan: {language}."
choose_language = "Pilih bahasa untuk kumpulan aturan ini. Daftar mengikuti terjemahan yang tersedia."
ask_markdown = "Kirim dokumen .md. Judul menjadi kategori dan item; setiap item bisa disunting di sini."
markdown_ok = "Berhasil mengimpor {count} item dari {name}."
markdown_bad = "Berkas itu bukan dokumen .md yang dapat dibaca. Kirim berkas Markdown atau gunakan tombol."
sections = "Bagian dalam draf ini: {count}. Ketuk salah satu untuk menyunting teks dan formatnya."
ask_format_text = "Kirim teks yang akan ditambahkan dengan gaya yang dipilih."

[help]
overview = "Baca aturan komunitas yang diterbitkan atau sunting dan terbitkan kumpulan aturan."

[help.commands]
body = "`/tcrules` `/rules`"

[help.what]
body = "Menu aturan hanya-baca untuk semua orang; editor memungkinkan staf mengelola kategori, butir, dan publikasi ke kanal."

# Label dan deskripsi kategori adalah data rule set di database, dikelola
# melalui bot. Tidak ada teks yang disimpan di kode atau katalog ini.

[menu]
body = "Ada aturan di {community}.\n\nPilih topik di bawah. Aturan federasi hanya untuk pelanggaran berat; sisanya panduan tiap grup dan tidak pernah menjadi ban federasi."
empty = "Belum ada aturan yang diterbitkan."
category = "Aturan: {category}"
index_title = "Aturan komunitas"
section = "{category}: {section}"
page = "Topik {page} dari {total}"
category_footer = "Aturan federasi berlaku di semua grup terhubung; topik lainnya tetap panduan tiap grup."
no_rules = "Tidak ada aturan di kategori ini."
preview = "Pratinjau\nBeginilah tampilan aturan di kanal. Belum ada yang diterbitkan sampai Anda menekan Publish."
preview_empty = "Pratinjau\nBelum ada yang ditampilkan. Tambahkan kategori dan aturan di *Edit Draft* terlebih dahulu."

[picker]
prompt = "Pilih aturan yang dilanggar. Nama kategori menandai aturan wajib federasi atau panduan grup. Hanya aturan wajib federasi yang menjadi dasar ban federasi."
other = "Lainnya / Tidak tercakup"
clear = "Kosongkan"
require_selection = "Pilih minimal satu aturan atau pilih Lainnya / Tidak tercakup."
ask_note = "Kirim catatan singkat (maksimal 200 karakter)."
bad_note = "Catatan harus 1-{limit} karakter."

[publish]
error = "Publish tidak selesai: {error}\n\nDraf Anda aman. Perbaiki masalahnya lalu tekan Publish lagi."
empty = "Belum ada yang diterbitkan.\n\nTambahkan minimal satu aturan di *Edit Draft*, lalu kembali dan tekan *Publish*."
result = "Diterbitkan. {synced} pesan kanal diperbarui, {failed} gagal."

[selected]
none = "Tidak ada aturan dipilih."
one = "Aturan: {titles}"
many = "Aturan ({count}): {titles}"
other = "Lainnya: {note}"

[ack]
recorded = "Terima kasih, kamu menerima aturan yang berlaku."
already = "Kamu sudah menerima aturan ini."
outdated = "Aturan ini sudah berubah sejak sapaan join."
wrong_member = "Tombol ini untuk anggota lain."
