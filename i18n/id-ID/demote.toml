# Runtime strings for demotion (demote_actions.py).
# [dm] sends to the demoted user (their personal locale, resolved inside
# execute); [abort] replies in the moderator's chat (resolved at call).
# Both render as rich HTML.
# Placeholders: {role} pre-formatted bold rank, {community}/{name} raw
# values, {verb} banned/muted/kicked, {user} pre-formatted mention,
# {target_role} raw role, {action} trigger noun.

[dm]
manual = "Peran {role} kamu di {community} telah dicabut oleh {name}."
auto = "Peran {role} kamu di {community} telah dicabut. Status federasi: {verb}."
warn = "Peran {role} kamu di {community} telah dicabut - kamu mencapai batas peringatan, jadi kamu didemosi dan tidak diblokir."
unban = "Peran {role} kamu di {community} telah dicabut oleh {name}. Ban federasi kamu juga sudah diangkat."
appeal = "Peran {role} kamu di {community} telah dicabut karena {name} menyetujui banding kamu dan mengangkat ban federasi."

[dm.verb]
ban = "diblokir"
mute = "dibisukan"
kick = "dikeluarkan"

[abort]
body = "{user} memegang peran federasi ({target_role}) dan tahap demote gagal, sehingga {action} tidak bisa lanjut dengan aman. Demosi manual dengan /tcdemote lalu ulangi {action}."
