# Privacy prose (privacy.py). Wording lives here; rich block structure is
# composed in privacy.py. Every key exists in both locales with the same
# placeholders. Placeholders: {bot} raw bot name, {community} raw name.

[msg]
bot_fallback = "This bot"
title = "Privacy and Data"
lead = "{bot} keeps a small set of records so the federation can moderate consistently."
list_title = "What is stored"
item_1 = "*Identity*: your Telegram user ID, first name, and username when you interact with the bot or a connected group."
item_2 = "*Ban records*: the reason, landed proof, issuing staff member, and timestamps."
item_3 = "*Warnings and mutes*: counts, reasons, and expiry times per group."
item_4 = "*Kick logs*: a short staff record of the action and its reason."
item_5 = "*Appeals*: what you write and any files you attach when you appeal a ban."
item_6 = "*Promotion requests*: your application and its review outcome."
visibility = "Ban, warn, mute, and kick records can be looked up by anyone with `/check` or `/checkme`; changing anything still requires the proper staff rank."
policy_hint = "Tap *Privacy Policy* below ↴ for the full policy, organized by section."

[index]
title = "Privacy Policy"
lead = "A plain-language guide to what {bot} stores, why it is kept, who can see it, and how long it stays."
hint = "Pick a section below ↴. Back returns here at any time."

[error]
invalid_section = "Invalid section."
not_found = "Section not found."

[section.collect]
label = "What We Collect"
lead = "When you interact with a connected group or {bot}, these records may be created:"
item_1 = "*User ID*: your numeric Telegram user ID."
item_2 = "*Name and username*: your first name and @username at the time of interaction."
item_3 = "*Ban records*: reason, proof link, issuing admin, and timestamps."
item_4 = "*Warnings and mutes*: reasons and expiry times, tracked per group."
item_5 = "*Kick logs*: the action and its reason, kept for staff reference."
item_6 = "*Appeals*: your appeal message and any supporting files you send."
item_7 = "*Promotion requests*: your application and its review outcome."
tail = "Only the records listed here are created by ordinary use of the bot."

[section.why]
label = "Why We Collect It"
lead = "Every record has one job: keeping the federation safe and its decisions reviewable."
item_1 = "*Consistent enforcement*: a ban in one group applies across every connected group."
item_2 = "*Audit trail*: staff can see who acted, when, and why."
item_3 = "*Appeals*: the proof and context needed to review a ban."
tail = "We do not use data for advertising, profiling, or anything outside federation moderation."

[section.access]
label = "Who Can Access It"
lead = "Reading enforcement history is open. Changing it is not."
item_1 = "`/check` and `/checkme` let anyone look up bans, warnings, mutes, and kicks, so enforcement stays transparent."
item_2 = "Banning, muting, promoting, and connecting groups require the proper {community} staff rank, re-checked on every command."
item_3 = "Log and appeal destinations are deployment-owned chats; only staff can act on what they contain."
tail = "No data is sold, rented, or shared with third parties."

[section.retention]
label = "How Long We Keep It"
lead = "Different records have different lifetimes:"
item_1 = "*Bans*: kept indefinitely as part of the federation log, so cross-group enforcement and appeal review keep working."
item_2 = "*Identity cache*: refreshed on each interaction and pruned automatically after 90 days without activity."
item_3 = "*Mutes and warnings*: timed mutes expire automatically. Warnings expire when the operator enables warn expiry; otherwise they stay until cleared."
item_4 = "*Appeals and promotion requests*: retained after a decision for reference and audit."
tail = "Removing cached identity data does not erase ban records needed for active enforcement."

[section.rights]
label = "Your Rights"
lead = "You can check your own status and ask for personal data to be reviewed or removed."
item_1 = "`/checkme` shows your own ban status at any time."
item_2 = "Message a {community} Admin or the Owner to ask for a review or deletion of personal data."
tail = "Requests are handled on a best-effort basis. Active ban records may be retained when they are needed for ongoing enforcement or federation integrity."

[section.contact]
label = "Contact"
lead = "Reach {community} staff through either of these channels:"
item_1 = "The main {community} discussion group."
item_2 = "This bot's appeal system, for ban-related matters."
tail = "For general data inquiries, write to a staff member in the main group."
