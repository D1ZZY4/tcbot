# Start menu prose (start.py). Structure and order live here; the title,
# divider, intro, capabilities, usage, and hint placeholders arrive as
# pre-formatted rich HTML from start.py. {botname} and {community} are raw.

[private]
body = """{title}
{divider}
{intro}

{capabilities}
{usage}
{divider}
{hint}"""
title = "{botname} Federation"
intro = "Federation management bot for {community}."
cap_bans = "Federation-wide bans"
cap_mutes = "Mutes and temporary restrictions"
cap_kicks = "Kicks"
cap_moderation = "Moderation across all connected groups"
usage = "Staff can run commands here or from any connected group."
hint = "Use the buttons below ↴ to explore what I can do."

[group]
body = """{title}
{divider}
{intro}

{hint}"""
title = "{botname} Federation"
intro = "Federation management bot for {community}."
hint = "Run /help for the full command list, or open me in PM for all options including privacy info and the about page."
