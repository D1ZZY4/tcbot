same_role = "{user} already holds the {role} role."
not_outranked = "You cannot change the role of someone at or above your own rank."
fail = "Failed to change the role. No changes were made; please try again."
done = "Done. {user} is now a {community} {role}."
dm = "Your role in {community} is now {role}."

[request]
anon_admin = "This command must be sent from your personal account, not as the group. Anonymous-admin commands are not accepted here."
already_role = "You're already a {role} - no request needed."
existing = "You already have a pending request (ID: {id})."

