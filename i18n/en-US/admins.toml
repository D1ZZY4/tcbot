# Admin help prose: overview plus per-section bodies.
# Structure (order, labels) stays in admins.py; only prose lives here.
# The Who section composes shared permission constants, so it stays in
# Python; everything below is static prose. Mini-markup only: `code`
# and *bold*, balanced and unnested.

[help]
overview = "Promote and demote staff, transfer ownership, and manage promotion requests across the federation."

[help.commands]
body = """
`/tcpromote` `/tcp`
`/tcsetrole`
`/tcdemote` `/tcd`
`/transferowner` `/tfowner`
`/tcpromoterequests` `/tcreqs`
`/tcpromotelist` `/tcplist`"""

[help.who]
body = """*/tcpromote*, */tcsetrole*, */tcdemote*, */tcpromotelist*: Owner and Admin.
*/transferowner*: {perm}
*/tcpromoterequests*: anyone (creates a self-request to the Owner)."""

[help.roles]
title = "Role Hierarchy"
body = """
*Owner* (rank 4) ➛ *Admin* (rank 3) ➛ *Developer* (rank 2) ➛ *Moderator* (rank 1)

You cannot promote a user to a rank equal to or above your own. Admins promoting someone to Admin queues a request for the Owner."""

[help.promote]
body = """
Assigns a role to a user. Omit the role argument to get an inline button menu.

*Usage:* `/tcpromote <target> [admin|developer|moderator]`
- Owner can promote to any role directly.
- Admin can promote to Developer or Moderator directly; promoting to Admin sends a pending request to the Owner for approval."""

[help.demote]
body = """
Removes a user's role. A confirmation button is shown before the action executes.

*Usage:* `/tcdemote <target>`
- Owner can demote any role.
- Admin can demote Developer or Moderator only.
- When a user with a role is banned or kicked, their role is removed and they are notified by DM."""

[help.setrole]
body = """
Changes an existing staff member's role instead of removing it. A picker shows only the tiers you may grant, excluding the one they already hold - so Admin to Moderator or Moderator to Developer works.

*Usage:* `/tcsetrole <target>`
- Owner can move staff between Admin, Developer, and Moderator.
- Admin can move staff between Developer and Moderator.
- The Owner can never be targeted, and a banned user cannot hold a role."""

[help.transferowner]
body = """
Transfers federation ownership to another user. The current Owner steps down to Admin. Owner only.

*Usage:* `/transferowner <target>`"""

[help.examples]
body = """
`/tcpromote @username developer`
`/tcpromote 123456789` shows the role selection menu
`/tcsetrole @username moderator` changes an existing role
`/tcdemote @username`
`/transferowner @newowner`
`/tcpromoterequests` request promotion to Admin
`/tcplist` list pending promotion requests"""

# Runtime strings for promotion (promote_request.py and promote_steps.py).
