no_pending = "No pending promotion requests."

# Promote/demote/transfer/list/decision UI. [role_picker]/[confirm]/
# [transfer]/[list]/[card] render as MarkdownV2; [decision.dm] sends plain.

[promote_ui]
role_picker = "Choose a role to assign to {user}:"

[demote]
confirm = "{user} is currently a {role}.\nConfirm to remove their role."
done = "Done. {user} has been removed from {role}."

[transfer]
set_owner_fail = "Couldn't transfer ownership due to a server error. No changes were made; please try again."
done = "Done. Ownership has been transferred to {user}."
admin_warn = " WARNING: {user} could not be kept as Admin due to a server error; grant the role manually with /tcpromote if needed."

[list]
header = "{title}"
