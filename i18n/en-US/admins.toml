no_removable_role = "That user doesn't hold a role that can be removed."
founder_demote_only = "Only the Founder can demote an Admin."
no_longer_removable = "That user no longer holds a removable role."
role_clear_failed = "Couldn't remove the role - it may have already been cleared."
role_lookup_failed = "I couldn't verify federation roles right now. Please try again in a moment."
request_not_found = "Request not found or already resolved."
classify_failed = "Classification check failed - please try again."
promote_needs_target = "Specify who to promote: reply to their message or give an ID/@username, e.g. /tcpromote @user developer."
promote_cancelled = "Promotion cancelled. No changes were made."
