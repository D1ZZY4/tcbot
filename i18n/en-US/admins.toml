role_fail = "Failed to save the role assignment. Please try again."
done_admin = "Done. {user} is now a {community} Admin."
done_role = "Done. {user} is now a {community} {role}."
already_admin = "That user is already an Admin. Demote them first before assigning {role}."
holds_role = "That user already holds the {role} role or higher."
pending = "There's already a pending promotion request for {user}."
queue_fail = "Failed to queue the promotion request. Please try again."
submitted = "Submitted - the Founder has been notified and will review it shortly."
target_is_founder = "That's the Founder - can't assign a role over them."
no_assign_perms = "You don't have permission to assign this role."

[promote.dm]
admin = "You've been promoted to Admin in {community} - welcome to the staff team."
