# Stats help prose: overview plus per-section bodies.
# Structure (order, labels) stays in stats.py; only prose lives here.
# Mini-markup only: `code` and *bold*, balanced and unnested.

[help]
overview = "See a live federation overview: Owner, staff, users, active bans, and connected groups, with drill-down menus for every section."

[help.commands]
body = "`/tcstats` `/tcs`"

[help.what]
body = "Shows a live federation summary: Owner, total staff broken down by role, the number of cached users, active federation bans, and connected chats."

[help.drills]
title = "Drill-downs"
body = """
*Staff Roster*: Owner, Admins, Developers, and Moderators, each listed with a mention under a divider.
*Users*: paginated table of every cached user with ID, username, and both activity dates in the row (Owner only - the button and the table are hidden from everyone else).
*Connected Chats*: paginated table of every active group with ID, connector, and connect date.
*User Bans*: paginated table of every active ban with ID, reason, and date, plus a *Search* shortcut to look up a user by name or ID.

Every table is paged with *Prev* and *Next* and ends with a *Back* button to the main summary."""

[help.examples]
body = """
`/tcstats`
`/tcs`"""

[error]
user_not_found = "User not found on this page."
group_not_found = "Group not found on this page."
ban_not_found = "Ban record not found on this page."
result_unavailable = "Result no longer available."
access_retry = "I couldn't verify your access right now. Please try again in a moment."
staff_only = "This panel is for TC Staff only."
db_fail = "Could not load the data. The database is unreachable, try again in a bit."

# Runtime strings for stats views (stats_flow.py). All render rich HTML
# except button labels (plain). Placeholders as documented per key.

[button]
roster = "Staff Roster"
bans = "User Bans"
chats = "Connected Chats"
users = "Users"

[main]
title = "{community} *Stats*"
owner_unset = "Not set"
degraded = "Some numbers could not be loaded; affected values are marked unavailable."
unavailable = "Unavailable"
owner_unavailable = "Could not be verified"

[main.breakdown]
admin = "Admin"
developer = "Dev"
moderator = "Moderator"

# Two-column overview rows. Values are built in Python and inserted raw.
[main.table]
owner = "Owner"
staff = "Staff"
users = "Users tracked"
bans = "Active bans"
chats = "Connected Chats"

# Column headers shared by the table views. Plain text, no placeholders.
[table]
user = "User"
id = "ID"
username = "Username"
first_seen = "First seen"
last_seen = "Last seen"
group = "Group"
connected_by = "Connected by"
reason = "Reason"
ban = "Ban ID"
date = "Date"
time = "Time"

[roster]
title = "*Staff Roster* - {community}"
owner = "Owner"
admins = "Admins"
developers = "Developers"
moderators = "Moderators"
section = "{label}"
member = "{user}"
empty = "No staff assigned"

[users]
empty = "*Users*\n\nNo cached users yet. The bot caches users as it sees them across connected groups."
header = "*Users* - {n} total - page {page}/{pages}"
item = "{i}. {user}"

[user_detail]
title = "*User Details*"
name = "*Name:* {user}"
id = "ID: {id}"
username = "Username: @{name}"
username_none = "Username: -"
last_name = "Last name: {name}"
first_seen = "First seen: {date}"
last_seen = "Last seen: {date}"
check_hint = "Use {command} for the full profile."

[chats]
empty = "*Connected Chats*\n\nNo connected groups yet."
header = "*Connected Chats* - {n} total - page {page}/{pages}"
item = "{i}. {title} - {id}"

[chat_detail]
title = "*Group Details*"
name = "Name: {name}"
chat_id = "*Chat ID:* {id}"
connected_by = "Connected by: {user}"
date = "Date: {date}"

[bans_view]
empty = "*User Bans*\n\nNo active federation bans."
header = "*User Bans* - {n} total - page {page}/{pages}"
item = "{i}. {name} - {id}"

[search]
title = "*Search User Bans*\n\nSend a name or user ID in the chat."
empty = "*Search:* \"{query}\"\n\nNo results found."
header = "*Search:* \"{query}\" ({n} found)"
item = "{i}. {name} - {id}"
