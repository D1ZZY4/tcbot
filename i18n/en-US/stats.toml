# Stats help prose: overview plus per-section bodies.
# Structure (order, labels) stays in stats.py; only prose lives here.
# Mini-markup only: `code` and *bold*, balanced and unnested.

[help]
overview = "See a live federation overview: Founder, staff, users, active bans, and connected groups, with drill-down menus for every section."

[help.commands]
body = "`/tcstats` (alias: `/tcs`)"

[help.what]
body = "Shows a live federation summary: Founder, total staff broken down by role, the number of cached users, active federation bans, and connected chats."

[help.drills]
body = """
*Staff Roster*: Founder, Admins, Developers, Testers, all listed with mentions.
*Users*: paginated list of every cached user (Founder only - the button and the list are hidden from everyone else). Numbered buttons open a per-user detail card.
*Connected Chats*: paginated list of every active group; drill-in shows owner, ID, and connect date.
*User Bans*: paginated list of every active ban with a *Search* shortcut to look up a user by name or ID.

Every view ends with a *Back* button to the main summary."""

[help.examples]
body = """
`/tcstats`
`/tcs`"""
