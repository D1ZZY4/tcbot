# Appeal help prose: overview plus per-section bodies.
# Structure (order, labels) stays in appeals.py; only prose lives here.
# Mini-markup only: `code` and *bold*, balanced and unnested.
# Placeholders: {window} carries pre-formatted bold markup from code.

[help]
overview = "Submit an appeal for an active federation ban. Staff review with a {window} for the banning admin."

[help.start]
body = "Tap the *Submit Appeal* button on your ban notification (sent by the bot in PM), or use `/checkme` and tap the *Submit Appeal* button that appears."

[help.who]
body = "Anyone with an active federation ban. You can only have one active appeal at a time."

[help.where]
body = "Bot PM only."

[help.how]
body = """
Once the appeal flow is open, send a single message starting with `#appeal` that includes all three of the following sections:

- *Log link*: the link to your ban log entry in the federation logs channel
- *Clarification*: your honest explanation of why the ban was issued or was a mistake
- *Agreement*: your commitment to follow community rules going forward"""

[help.format]
body = """
#appeal
Log link: https://t.me/TranssionCoreFederationLogs/123
Clarification: I shared links in multiple groups without reading the rules.
Agreement: I will follow all community guidelines going forward."""

[help.next]
body = """
Your appeal is forwarded to TC Staff for review. The admin who issued the original ban has a {window} to respond; after that, any admin can act.

If approved: your ban is lifted immediately across all connected groups.
If rejected: your ban remains in place.
You will be notified by the bot either way."""

