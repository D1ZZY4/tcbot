# Rules feature: editor dialog, public menu, and acknowledgement.
# Templates stay raw; the engine escapes rich HTML at render time.

[editor]
categories = "Categories"
items = "Items"
panel = "Rules editor\n*Set:* {name}\n*Status:* {status}\n*Items:* {count}"
empty_hint = "This draft is empty. Start with *Edit Draft*, add a category, then add your first rule."
ready_hint = "Looking good. *Preview* shows what members will see, and *Publish* shares this version in the channel."
ask_category = "Send the category title."
ask_title = "Send the item title."
ask_body = "Send the item body (plain text)."
ask_url = "Send an optional http(s) reference URL, or - to skip."
bad_title = "The title must be 1-{limit} characters."
bad_body = "The body must be 1-{limit} characters."
bad_url = "The reference URL must be an http(s) link of at most 500 characters."
confirm_discard = "Discard the current draft? Published rules are not affected."
discarded = "Draft discarded."
cancelled = "Rules editor closed."
unexpected = "Use the buttons below to keep editing, or close the editor."
open_pm = "Open a private chat with me to continue."
ask_rename = "Send the new category title."
status = "Channel: {synced} synced, {failed} failed, {missing} missing, {retired} retired. Acknowledgements: {acks}."

[help]
overview = "Read the published community rules or edit and publish the rule set."

[help.commands]
body = "`/tcrules` `/rules`"

[help.what]
body = "Read-only rules menu for everyone; the editor lets staff manage categories, items and channel publication."

# Category labels mirror the operator-local rule documents. The category key is
# the document stem; wording lives here so it stays translatable.
[category.cheat]
label = "Cheating"

[category.doxing-dan-privasi]
label = "Doxing and Privacy"

[category.identitas]
label = "Identity"

[category.karya-dan-atribusi]
label = "Work and Attribution"

[category.konten-pornografi-nsfw]
label = "Adult and NSFW Content"

[category.materi-pengujian]
label = "Test Material"

[category.mod-apk-dan-bajakan]
label = "Modified and Pirated Apps"

[category.module-root]
label = "Root Modules"

[category.out-off-topic]
label = "Off Topic"

[category.pengelola]
label = "Moderators"

[category.penipuan]
label = "Scams"

[category.perundungan-dan-kebencian]
label = "Bullying and Hate"

[category.politik]
label = "Politics"

[category.promosi]
label = "Promotion"

[category.sanksi]
label = "Sanctions"

[category.spam]
label = "Spam"

[category.transaksi]
label = "Transactions"

[category.federasi]
label = "The Federation"

[category.keanggotaan]
label = "Membership"

[category.klarifikasi]
label = "Brand Clarification"

[category.persetujuan-pendiri]
label = "Founders' Consent"

[menu]
body = "There are rules on {community}.\n\nPick a topic below. Federation-wide rules are the serious violations; the rest is group-level guidance and never becomes a federation ban on its own."
empty = "There are no published rules yet."
category = "Rules: {category}"
index_title = "Community rules"
section = "{category}: {section}"
page = "Topic {page} of {total}"
category_footer = "Use Prev and Next to move between topics. Serious violations are enforced across every connected group; the other topics are group-level guidance."
no_rules = "No rules in this category."
preview = "Preview\nThis is how the rules will look in the channel. Nothing is published until you tap Publish."
preview_empty = "Preview\nThere is nothing to show yet. Add a category and a rule in *Edit Draft* first."

[picker]
prompt = "Select the rules that were broken. Category names mark federation-wide rules versus group guidance. Only a federation-required rule can justify a federation ban."
other = "Other / Not covered"
clear = "Clear"
require_selection = "Select at least one rule or choose Other / Not covered."
ask_note = "Send a short note (at most 200 characters)."
bad_note = "The note must be 1-{limit} characters."

[publish]
error = "Publish could not finish: {error}\n\nYour draft is safe. Fix the issue and tap Publish again."
empty = "Nothing to publish yet.\n\nAdd at least one rule in *Edit Draft* first, then come back and tap *Publish*."
result = "Published. {synced} channel message(s) updated, {failed} failed."

[selected]
none = "No rule selected."
one = "Rule: {titles}"
many = "Rules ({count}): {titles}"
other = "Other: {note}"

[ack]
recorded = "Thanks, you accepted the current rules."
already = "You already accepted these rules."
outdated = "These rules have changed since the greeting."
disabled = "Acknowledgement is no longer required."
wrong_member = "This button belongs to another member."

