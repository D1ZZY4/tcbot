# Join/leave event strings (greeting.py). All render as rich HTML
# in the group or private-chat language. Placeholders: {user} pre-formatted
# mention, {uid}/{ban} pre-formatted code, {first}/{last}/{username}/{reason}/
# {group} raw, {community} raw community name.

[notice]
banned_group = "Federation ban enforced on join.\nUser: {user}\nID: {uid}\nFirst name: {first}\nLast name: {last}\nUsername: {username}\nBan ID: {ban}\n\nThe user was banned in this group. Use View Log and View Proof for details, or Submit Appeal to request a review."
banned_dm = "You are federation-banned from {community} and were banned in {group}.\n\nBan ID: {ban}\nReason: {reason}\n\nUse View Log and View Proof for details. If you believe this is a mistake, Submit Appeal."

[welcome]
body = "Welcome, {user}. This is an official {community} group. Please read the group rules before participating."

[left]
body = "{user} has left."
