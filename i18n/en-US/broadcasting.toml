# Broadcast help prose: overview plus per-section bodies.
# Structure (order, labels) stays in broadcasting.py; only prose lives here.
# Mini-markup only: `code` and *bold*, balanced and unnested.
# Placeholders: {community} = raw community name.

[help]
overview = "Sends a message to every group currently connected to {community}."

[help.commands]
body = "`/tcbroadcast` (alias: `/bc`)"

[help.what]
body = """
Sends a message to every group currently connected to {community}.

You can compose the message in two ways:
- Type the message directly after the command (MarkdownV2 formatting is supported; markup that fails to parse is delivered as plain text).
- Reply to an existing message with `/bc` to forward that message to all groups.

When the broadcast is complete, the bot shows a summary of how many groups received the message and how many deliveries failed, and posts a log entry to the federation logs channel."""

[help.examples]
body = """
`/tcbroadcast Reminder: please review the community rules.`
`/bc *Event tonight* (join us at 8 PM UTC).`
Or reply to a message and run `/bc` to forward it to all groups."""
