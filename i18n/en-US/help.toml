# Help index prose for help.py itself: the topic-list header.
# Structure stays in help.py; only prose lives here.
# Placeholders: {title} carries pre-formatted heading markup from code,
# {divider} is a rich rule and {quote} is a plain block quotation.

[index]
title = "{botname} Help"
body = """{title}
{divider}
{quote}"""
guidance = "Select a module below ↴ to read its overview and commands, or use /help module to jump straight to a topic."

# Runtime strings (help.py). [error] sends plain; [note]/[module]/
# [section]/[not_found] render as rich HTML. Placeholders: {title}/
# {prefixes}/{query}/{hint} pre-formatted fragments, {overview}/
# {content} pre-rendered help prose, {divider} a rich rule and
# {list} a rich bulleted block.

[error]
topic_not_found = "Topic not found."
section_not_found = "Section not found."
invalid_section = "Invalid section."

[module]
title = "Help for {name}"
body = """{title}
{divider}
{overview}
{divider}"""

[section]
body = """{title}
{divider}
{list}"""

[not_found]
body = "Module {query} not found.{hint}"
hint = "\n\nDid you mean: {suggestions}?"

[group]
alert = "Run /help in this group to browse all modules and commands."
