# About prose (about.py, start.py, connect verification). Rendered as rich HTML.
# Placeholders: {community} raw name. Labels and tails are plain text.

[index]
title = "About {community}"
lead = "{community} is an independent federation of Telegram groups for Transsion device communities. Groups stay independent and share one minimum standard for moderation."
hint = "Pick a section below ↴. Back returns here at any time."

[error]
invalid_section = "Invalid section."
not_found = "Section not found."

[section.federasi]
label = "The Federation"
lead = "What {community} is, and what it is not."
item_1 = "A voluntary federation of independent Telegram groups around Transsion devices. It is not a company or a legal entity."
item_2 = "Every group keeps its own rules. These rules are only a shared minimum, so a group rule may be stricter but not contradictory."
item_3 = "A federation ban and a federation mute apply across every connected group. A kick only removes the target from the group where it was issued."
item_4 = "Rules change by group vote, not by one admin acting alone."
item_5 = "Warnings are recorded per group. Reaching the limit triggers an automatic federation ban, and a failed delivery is retried without cancelling the action in other groups."
tail = "Joining accepts this minimum standard without giving up group independence."

[section.keanggotaan]
label = "Membership"
lead = "How a group and a person become part of the federation."
item_1 = "A group joins when its admin approves, it is listed in the official channel, and the approval still stands."
item_2 = "A person joins by entering at least one member group. Membership belongs to the group, not to {community}."
item_3 = "Members can read the rules, ask questions, share their own work, and appeal a decision."
item_4 = "Leaving does not end a confidentiality duty or an open case."
tail = "Anyone may leave at any time without asking a moderator."

[section.klarifikasi]
label = "Clarification"
lead = "The federation's relationship with device brands."
item_1 = "{community} is an independent community of users and fans. It is not affiliated with Transsion, TECNO, itel, Infinix, Carlcare, or any related party."
item_2 = "Brand names are used only to name the devices the community is about. They give no rights, endorsement, or support."
item_3 = "Claiming that a group or a member is officially backed needs written permission from the brand owner."
tail = "A false claim of official backing is a rule violation."
