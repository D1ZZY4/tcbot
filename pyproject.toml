[project]
name = "tcbot"
version = "6.9.0"
description = "TCF | Transsion Core Federation - Telegram Bot"
requires-python = ">=3.14"
dependencies = [
    "python-telegram-bot[rate-limiter]>=22.8,<23",
    "motor>=3.7.1,<4",
    "flask>=3.1.3,<4",
    "python-dotenv>=1.2.4,<2",
    "redis[hiredis]>=8.1,<9",
    "apscheduler[mongodb]==3.11.3",
    "cachetools>=7.3.0,<8",
    "speedtest-cli>=2.1.3,<3",
    "certifi>=2026.10.23",
    "kurigram[fast]>=2.2.26,<3",
    "msgspec>=0.22,<0.23",
    "pymongo>=4.19.0,<5",
    "loguru>=0.7.3",
]

[dependency-groups]
dev = [
    "ruff>=0.17.4,<1",
    "pytest>=9.2,<10",
    "pyright>=1.1.414,<2",
    "pytest-asyncio>=1.4.1,<2",
    "pre-commit>=4.7,<5",
    "py-spy>=0.4.3,<1",
    "pytest-xdist>=3.8.0,<4",
]

[tool.setuptools.packages.find]
include = ["tcbot*"]

[tool.ruff]
line-length = 88
target-version = "py314"
exclude = [".local/", ".agents/", ".kilo/", ".claude/", "attached_assets/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "D",
    "E4",
    "E7",
    "E9",
    "F",
    "FBT",
    "I",
    "PERF",
    "PIE",
    "PLC",
    "PLE",
    "PTH",
    "RET",
    "RUF",
    "SIM",
    "TC",
    "TRY400",
    "TRY401",
    "UP",
    "W",
]
ignore = [
    "D203",  # Conflicts with D211 (no-blank-line-before-class); D211 is preferred
    "D213",  # Conflicts with D212 (multi-line-summary-first-line); D212 is preferred
    "TC001", # Application imports in TYPE_CHECKING: internal TypedDicts used in runtime dict ops
    "TC002", # Runtime import needed for cast() and local type annotations
    "TC004", # Same: runtime import for local annotations on runtime values
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D",
] # Test functions need no docstrings; module docs stay required
"tcbot/modules/**/__init__.py" = [
    "F401",
] # Package inits are re-export surfaces (no __all__); used names live in submodules

[tool.pylint.format]
max-module-lines = 1000
