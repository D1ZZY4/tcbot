[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"


[project]
name = "tcbot"
version = "6.9.0"
description = "TCF | Transsion Core Federation - Telegram Bot"
requires-python = ">=3.14"
dependencies = [
    # Telegram
    "python-telegram-bot[rate-limiter]>=22.8,<23",
    "kurigram[fast]>=2.2.27,<3",

    # Database
    "pymongo>=4.19,<5",

    # Cache and background scheduling
    "redis[hiredis]>=8.1,<9",
    "apscheduler[mongodb]==3.11.3",
    "cachetools>=8.0,<9",

    # HTTP and networking
    "flask>=3.1.3,<4",
    "certifi>=2026.10.23",

    # Serialization and configuration
    "msgspec>=0.22,<0.23",
    "python-dotenv>=1.2.4,<2",

    # Logging
    "loguru>=0.7.3,<1",
]


[project.optional-dependencies]

# Production observability and error monitoring
observability = [
    "prometheus-client>=0.26,<0.27",
    "sentry-sdk[loguru]>=2.74,<3",
]

# Optional asyncio performance optimization for Linux
performance = [
    "uvloop>=0.23,<0.24; sys_platform == 'linux'",
]


[dependency-groups]

dev = [
    # Linting and formatting
    "ruff>=0.17.4,<1",

    # Static analysis
    "pyright>=1.1.414,<2",

    # Testing
    "pytest>=9.2,<10",
    "pytest-asyncio>=1.4.1,<2",
    "pytest-xdist>=3.8,<4",
    "pytest-cov>=7.1,<8",
    "hypothesis>=6.170.15,<7",

    # Database test double: verifies the MongoDB query shapes (aggregation
    # pipeline, partial unique index) without a live server.
    "mongomock>=4.3,<5",

    # Development workflow
    "pre-commit>=4.7,<5",

    # Performance profiling
    "py-spy>=0.4.3,<1",
]


[tool.setuptools.packages.find]
include = ["tcbot*"]


[tool.ruff]
line-length = 88
target-version = "py314"
exclude = [
    ".local/",
    ".agents/",
    ".kilo/",
    ".claude/",
    "attached_assets/",
]


[tool.ruff.lint]

select = [
    "B",
    "C4",
    "D",
    "E4",
    "E7",
    "E9",
    "F",
    "FBT",
    "I",
    "PERF",
    "PIE",
    "PLC",
    "PLE",
    "PTH",
    "RET",
    "RUF",
    "SIM",
    "TC",
    "TRY400",
    "TRY401",
    "UP",
    "W",
]

ignore = [
    "D203",  # Conflicts with D211
    "D213",  # Conflicts with D212
    "TC001", # Preserve application imports required at runtime
    "TC002", # Preserve runtime imports used by typing operations
    "TC004", # Preserve runtime annotation imports
]


[tool.ruff.lint.per-file-ignores]

"tests/**" = [
    "D101",
    "D102",
    "D103",
    "D105",
    "D106",
    "D107",
] # Test functions and classes need no docstrings; module docs remain required

"tcbot/modules/**/__init__.py" = [
    "F401",
] # Package inits intentionally expose re-export surfaces


[tool.pytest.ini_options]

testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"


[tool.coverage.run]

branch = true
source = ["tcbot"]


[tool.coverage.report]

show_missing = true
skip_covered = true
