[project]
name = "tcbot"
version = "6.9.0"
description = "TCF | Transsion Core Federation - Telegram Bot"
requires-python = ">=3.13"
dependencies = [
    "python-telegram-bot[rate-limiter]>=22.8,<23",
    "motor>=3.7,<4",
    "flask>=3.1,<4",
    "python-dotenv>=1.2,<2",
    "redis[hiredis]>=8.0,<9",
    "apscheduler[mongodb]==3.11.3",
    "cachetools>=7.1,<8",
    "speedtest-cli>=2.1,<3",
    "certifi>=2026.7.22",
    "kurigram[fast]>=2.2,<3",
    "structlog>=24.1,<26",
    "msgspec>=0.20",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pyright",
    "pytest-asyncio>=0.24,<1",
    "pre-commit>=4.0,<5",
    "py-spy>=0.4,<1",
    "pytest-xdist>=3.8.0",
]

[tool.setuptools.packages.find]
include = ["tcbot*"]

[tool.ruff]
line-length = 88
target-version = "py314"
exclude = [".local/", ".agents/", ".kilo/", ".claude/", "attached_assets/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint]
select = ["B", "C4", "D", "E4", "E7", "E9", "F", "FBT", "I", "PERF", "PIE", "PLC", "PLE", "PTH", "RET", "RUF", "SIM", "TC", "TRY400", "TRY401", "UP", "W"]
ignore = [
    "D203",    # Conflicts with D211 (no-blank-line-before-class); D211 is preferred
    "D213",    # Conflicts with D212 (multi-line-summary-first-line); D212 is preferred
    "TC001",   # Application imports in TYPE_CHECKING: internal TypedDicts used in runtime dict ops
    "TC002",   # Runtime import needed for cast() and local type annotations
    "TC004",  # Same: runtime import for local annotations on runtime values
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]  # Test functions need no docstrings; module docs stay required
