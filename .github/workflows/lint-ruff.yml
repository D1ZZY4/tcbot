name: Lint (Ruff)

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Ruff lint and format check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Dummy values for the import check: tcbot validates presence and
      # shape at import time but never connects, so no real secrets are
      # needed (and fork PRs have no secrets to inject).
      BOT_TOKEN: "000000:dummy-token-for-lint000000000000000"
      MONGODB_URI: "mongodb://localhost:27017"
      OWNER_ID: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check lint
        run: uv run ruff check .

      - name: Check file-size budget
        run: uv run python -c "import pathlib, sys; over = [(len(p.read_text().splitlines()), str(p)) for p in list(pathlib.Path('tcbot').rglob('*.py')) + list(pathlib.Path('api').rglob('*.py')) if '__pycache__' not in str(p) and len(p.read_text().splitlines()) > 375]; print('\n'.join(f'{n} {p}' for n, p in over) or 'file-size budget OK'); sys.exit(1 if over else 0)"

      - name: Import check
        run: uv run python -c "import tcbot; print('import OK')"
