name: TCF Bot - 24/7 Runner

on:
  workflow_dispatch:
  schedule:
    # Resurrection fallback every 15 min. If the self-chain ever breaks (a run
    # crashes before it can dispatch its successor), this restarts coverage
    # within ~15 min instead of waiting for the next day. The concurrency
    # group serializes it: when a healthy run is already active, the cron
    # run queues behind it (it is NOT discarded), so back-to-back crons can
    # pile up behind a long holder; each queued run still self-chains on
    # completion.
    - cron: "*/15 * * * *"
  push:
    branches:
      - main
    paths:
      # * Runtime-only preempt: a push touching these files restarts the live
      # * bot on the new commit (classify + preempt steps below). Docs-only
      # * pushes never start a run, so the live bot is left untouched.
      - "tcbot/**"
      - "i18n/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/run-bot.yml"

concurrency:
  group: tcf-bot-runner
  # * Never cancel-in-progress at the workflow level: the */15 cron and the
  # * handover dispatch must queue behind the live run, not kill it (a cron
  # * tick would otherwise terminate the bot every 15 minutes). Preemption on
  # * runtime pushes is explicit in the preempt step below, so the diff is
  # * classified first and queued cron pileups are cleared deliberately.
  cancel-in-progress: false

permissions:
  contents: read
  # * actions:write lets a runtime push cancel the stale live run (preempt
  # * step) through the built-in GITHUB_TOKEN. No PAT or admin token needed.
  actions: write

jobs:
  run:
    name: Run bot (5h window, self-chaining)
    runs-on: ubuntu-latest
    # 5h window + 30m buffer. GitHub hard-caps a single job at 6 hours.
    timeout-minutes: 330

    env:
      # Window timing (seconds)
      WINDOW_SECONDS: "18000"   # 5 hours of actual bot runtime
      HANDOVER_LEAD: "600"      # dispatch the next run 10 min before the end

      # Bot configuration (set these as repository secrets)
      BOT_TOKEN:               ${{ secrets.BOT_TOKEN }}
      MONGODB_URI:             ${{ secrets.MONGODB_URI }}
      OWNER_ID:                ${{ secrets.OWNER_ID }}
      DB_NAME:                 ${{ secrets.DB_NAME }}
      COMMUNITY_NAME:          ${{ secrets.COMMUNITY_NAME }}
      PREFIXES:                ${{ secrets.PREFIXES }}
      MAIN_GROUP:              ${{ secrets.MAIN_GROUP }}
      MAIN_CHANNEL:            ${{ secrets.MAIN_CHANNEL }}
      EXTEND_GROUP:            ${{ secrets.EXTEND_GROUP }}
      PROOFS:                  ${{ secrets.PROOFS }}
      LOGS:                    ${{ secrets.LOGS }}
      LOGS_ERRORS:             ${{ secrets.LOGS_ERRORS }}
      APPEALS:                 ${{ secrets.APPEALS }}
      LOG_LEVEL:               ${{ secrets.LOG_LEVEL }}
      PORT:                    ${{ secrets.PORT }}
      REDIS_URL:               ${{ secrets.REDIS_URL }}
      APPEAL_LOG_HANDLE:       ${{ secrets.APPEAL_LOG_HANDLE }}
      APPEAL_DISCUSSION_TOPIC: ${{ secrets.APPEAL_DISCUSSION_TOPIC }}
      WARN_EXPIRY_DAYS:        ${{ secrets.WARN_EXPIRY_DAYS }}
      WARN_LIMIT:              ${{ secrets.WARN_LIMIT }}
      FED_WARN_LIMIT:          ${{ secrets.FED_WARN_LIMIT }}
      WEBHOOK_URL:             ${{ secrets.WEBHOOK_URL }}
      WEBHOOK_SECRET:          ${{ secrets.WEBHOOK_SECRET }}
      PROOF_TIMEOUT_SECONDS:   ${{ secrets.PROOF_TIMEOUT_SECONDS }}
      APPEAL_TIMEOUT_SECONDS:  ${{ secrets.APPEAL_TIMEOUT_SECONDS }}
      ALBUM_DEBOUNCE_SECONDS:  ${{ secrets.ALBUM_DEBOUNCE_SECONDS }}
      MODULES_LOAD:            ${{ secrets.MODULES_LOAD }}
      MODULES_NO_LOAD:         ${{ secrets.MODULES_NO_LOAD }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Classify push changes (push only)
        id: classify
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          # * Second safety net behind the paths: filter above: list the real
          # * filenames and restart only when a runtime path changed. A failed
          # * comparison (for example a fresh branch with an all-zero before
          # * SHA) fails closed to a restart so new code is never silently
          # * skipped.
          files="$(gh api "repos/${{ github.repository }}/compare/${PUSH_BEFORE}...${PUSH_AFTER}" --paginate -q '.files[].filename' 2>/dev/null || true)"
          if [ -z "$files" ]; then
            echo "runtime=true" >> "$GITHUB_OUTPUT"
            echo "Compare unavailable; failing closed to a restart."
            exit 0
          fi
          if printf '%s\n' "$files" | grep -qE '^(tcbot/|i18n/|pyproject\.toml|uv\.lock|\.python-version|\.github/workflows/run-bot\.yml)'; then
            echo "runtime=true" >> "$GITHUB_OUTPUT"
            echo "Runtime files changed; this run will preempt the live one."
          else
            echo "runtime=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only push; leaving the live run untouched."
          fi

      - name: Preempt stale runs (runtime push only)
        if: github.event_name == 'push' && steps.classify.outputs.runtime == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # * Rolling restart without queueing: cancel every other in-progress
          # * or queued run of this workflow (the stale live bot plus any
          # * piled-up cron ticks), then wait bounded for them to exit so the
          # * bot below starts with no overlap (no 409 Conflict, one webhook
          # * owner). Schedule and handover runs never pass this gate, so they
          # * keep queueing behind the live bot as before. Cancelled runs keep
          # * their scrub/upload steps (if:always), so diagnostics are kept.
          self="${{ github.run_id }}"
          mapfile -t ids < <(gh run list --workflow run-bot.yml --limit 50 \
            --json databaseId,status \
            -q '.[] | select(.status == "in_progress" or .status == "queued") | .databaseId')
          stale=()
          for id in "${ids[@]}"; do
            [ "$id" != "$self" ] && stale+=("$id")
          done
          if [ "${#stale[@]}" -eq 0 ]; then
            echo "No stale runs; starting the bot on the new commit."
            exit 0
          fi
          for id in "${stale[@]}"; do
            echo "Cancelling stale run $id..."
            gh run cancel "$id" || echo "::warning::Could not cancel run $id; continuing."
          done
          # * Bounded wait for graceful shutdown of the old run (its SIGTERM
          # * path plus scrub/upload). On timeout this run proceeds anyway;
          # * the concurrency group still serializes actual execution.
          deadline=$(( $(date +%s) + 180 ))
          while :; do
            remaining="$(gh run list --workflow run-bot.yml --limit 50 \
              --json databaseId,status \
              -q "[.[] | select(.databaseId != ${self} and (.status == \"in_progress\" or .status == \"queued\")) | length]")"
            [ "${remaining:-1}" = "0" ] && break
            [ "$(date +%s)" -ge "$deadline" ] && break
            sleep 10
          done
          echo "Preempt done (remaining stale: ${remaining:-unknown}). Starting the bot."

      - name: Detect self-chain capability
        id: pat
        env:
          BOT_PAT: ${{ secrets.BOT_PAT }}
        run: |
          if [ -n "$BOT_PAT" ]; then
            echo "has_pat=true" >> "$GITHUB_OUTPUT"
            echo "PAT detected: self-chaining is enabled."
          else
            echo "has_pat=false" >> "$GITHUB_OUTPUT"
            echo "No BOT_PAT secret: relying on the cron schedule for restarts."
          fi

      - name: Run bot with watchdog and self-chain
        env:
          BOT_PAT: ${{ secrets.BOT_PAT }}
          HAS_PAT: ${{ steps.pat.outputs.has_pat }}
        run: |
          set -uo pipefail

          start_bot() {
            # * Background directly in this shell (no command substitution):
            # * $! stays a real child job, so kill -0 supervises the actual
            # * process and the shutdown block below can wait for its exit.
            # * (Capturing via BOT_PID="$(start_bot)" would run this in a
            # * subshell, leaving wait with a non-child PID that always fails.)
            uv run python -m tcbot > bot.log 2>&1 &
            BOT_PID=$!
          }

          echo "Starting bot..."
          start_bot
          echo "Bot started with PID $BOT_PID"

          deadline=$(( $(date +%s) + WINDOW_SECONDS ))
          handover_at=$(( deadline - HANDOVER_LEAD ))
          handover_done=false
          restarts=0
          first_death=0

          # Supervisory loop
          while :; do
            now=$(date +%s)
            [ "$now" -ge "$deadline" ] && break

            # Watchdog: restart the bot if the process has exited.
            if ! kill -0 "$BOT_PID" 2>/dev/null; then
              echo "::warning::Bot process $BOT_PID died. Restarting."
              # * Scrub credential-shaped strings before printing: workflow
              # * logs on a public repository are world-readable (same
              # * patterns as error_reporter.py redaction).
              tail -n 40 bot.log 2>/dev/null | sed -E -e 's/[0-9]{6,}:[A-Za-z0-9_-]{20,}/[REDACTED_TOKEN]/g' -e 's#://[^:@/ \t]*:[^@/ \t]*@#://[REDACTED]@#g' || true
              restarts=$((restarts + 1))
              [ "$first_death" = "0" ] && first_death=$now
              # * Fail-fast config (bad token/URI) would otherwise restart
              # * ~600x per window, hammering Telegram/Mongo. Five deaths
              # * within 10 minutes aborts; the */15 cron covers recovery.
              if [ "$restarts" -ge 5 ] && [ $((now - first_death)) -lt 600 ]; then
                echo "::error::Bot died 5 times within 10 minutes; giving up."
                exit 1
              fi
              # * Linear backoff (capped) so repeated crashes do not hot-loop.
              backoff=$((30 * restarts))
              [ "$backoff" -gt 300 ] && backoff=300
              sleep "$backoff"
              start_bot
              echo "Bot restarted with PID $BOT_PID"
            fi

            # Self-chain: queue the next run shortly before the window ends.
            # Retry the dispatch a few times so a single transient API failure
            # does not break the chain; the */15 cron is the last-resort backup.
            if [ "$handover_done" = "false" ] && [ "$now" -ge "$handover_at" ]; then
              if [ "$HAS_PAT" = "true" ]; then
                echo "Dispatching the next run (handover)..."
                dispatched=false
                for attempt in 1 2 3; do
                  if GH_TOKEN="$BOT_PAT" gh workflow run run-bot.yml --ref "main"; then
                    echo "Next run queued (attempt $attempt); it will start when this one stops."
                    dispatched=true
                    break
                  fi
                  echo "::warning::Handover dispatch attempt $attempt failed; retrying in 10s."
                  sleep 10
                done
                if [ "$dispatched" = "false" ]; then
                  echo "::warning::All handover dispatch attempts failed; the */15 cron will cover the restart."
                fi
              fi
              handover_done=true
            fi

            sleep 30
          done

          echo "Window elapsed. Stopping bot gracefully..."
          kill "$BOT_PID" 2>/dev/null || true
          # * Bounded wait for graceful exit (uv forwards SIGTERM to the bot
          # * child since 0.5.x, and PTB handles it): without this, the
          # * scrub/upload steps below race the dying process and the
          # * artifact loses its final lines. 60 s sits far inside the 30 min
          # * post-window buffer; exceeding it proceeds anyway and the runner
          # * tears the machine down after the job.
          for _ in $(seq 1 30); do
            kill -0 "$BOT_PID" 2>/dev/null || break
            sleep 2
          done
          if kill -0 "$BOT_PID" 2>/dev/null; then
            echo "::warning::Bot did not exit within 60s of SIGTERM; leaving it for runner teardown."
          fi
          echo "Bot stopped."

      - name: Scrub log of credentials
        if: always()
        run: |
          # * bot.log ships as a public artifact below; strip credential-shaped
          # * strings first (token id:hash, URI user:pass@ incl. password-only,
          # * same patterns as error_reporter.py). Message excerpts remain by
          # * design for crash debugging; see docs/operations/ci-cd.md.
          if [[ -f bot.log ]]; then
            sed -E -e 's/[0-9]{6,}:[A-Za-z0-9_-]{20,}/[REDACTED_TOKEN]/g' -e 's#://[^:@/ \t]*:[^@/ \t]*@#://[REDACTED]@#g' bot.log > bot-scrubbed.log
          fi

      - name: Detect crash in log
        if: always()
        run: |
          if [[ -f bot-scrubbed.log ]] && grep -qiE "(Traceback|^\w+Error:|CRITICAL)" bot-scrubbed.log; then
            echo "::warning::Crash signature found in bot.log (last 120 lines saved)."
            grep -n "" bot-scrubbed.log | tail -120 > crash_tail.log
          fi

      - name: Upload bot log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bot-log-${{ github.run_id }}
          path: |
            bot-scrubbed.log
            crash_tail.log
          retention-days: 7
          if-no-files-found: ignore
