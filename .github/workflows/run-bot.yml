name: TCF Bot - 24/7 Runner

on:
  workflow_dispatch:
  schedule:
    # Resurrection fallback every 15 min. If the self-chain ever breaks (a run
    # crashes before it can dispatch its successor), this restarts coverage
    # within ~15 min instead of waiting for the next day. The concurrency
    # group serializes it: when a healthy run is already active, the cron
    # run queues behind it (it is NOT discarded), so back-to-back crons can
    # pile up behind a long holder; each queued run still self-chains on
    # completion.
    - cron: "*/15 * * * *"
  push:
    branches:
      - main
    paths:
      # * Runtime-only restart: a push touching these files queues a
      # * successor run on the new commit. The LIVE run detects it below
      # * (self-preempt poll) and stops gracefully, freeing the gate, so
      # * the new commit serves within minutes. Docs-only pushes never
      # * start a run, so the live bot is left untouched.
      - "tcbot/**"
      - "i18n/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/run-bot.yml"

concurrency:
  group: tcf-bot-runner
  # * Always false: the */15 cron and the handover dispatch must queue
  # * behind the live run, never kill it. Restart-on-push is handled by
  # * the live run itself (self-preempt poll in the watchdog): a queued
  # * successor could never clear this gate from inside its own job,
  # * since its steps do not start while the live run holds it.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    name: Run bot (5h window, self-chaining)
    runs-on: ubuntu-latest
    # 5h window + 30m buffer. GitHub hard-caps a single job at 6 hours.
    timeout-minutes: 330

    env:
      # Window timing (seconds)
      WINDOW_SECONDS: "18000"   # 5 hours of actual bot runtime
      HANDOVER_LEAD: "600"      # dispatch the next run 10 min before the end

      # Bot configuration (set these as repository secrets)
      BOT_TOKEN:               ${{ secrets.BOT_TOKEN }}
      MONGODB_URI:             ${{ secrets.MONGODB_URI }}
      OWNER_ID:                ${{ secrets.OWNER_ID }}
      DB_NAME:                 ${{ secrets.DB_NAME }}
      COMMUNITY_NAME:          ${{ secrets.COMMUNITY_NAME }}
      PREFIXES:                ${{ secrets.PREFIXES }}
      MAIN_GROUP:              ${{ secrets.MAIN_GROUP }}
      MAIN_CHANNEL:            ${{ secrets.MAIN_CHANNEL }}
      EXTEND_GROUP:            ${{ secrets.EXTEND_GROUP }}
      PROOFS:                  ${{ secrets.PROOFS }}
      LOGS:                    ${{ secrets.LOGS }}
      LOGS_ERRORS:             ${{ secrets.LOGS_ERRORS }}
      APPEALS:                 ${{ secrets.APPEALS }}
      LOG_LEVEL:               ${{ secrets.LOG_LEVEL }}
      PORT:                    ${{ secrets.PORT }}
      REDIS_URL:               ${{ secrets.REDIS_URL }}
      APPEAL_LOG_HANDLE:       ${{ secrets.APPEAL_LOG_HANDLE }}
      APPEAL_DISCUSSION_TOPIC: ${{ secrets.APPEAL_DISCUSSION_TOPIC }}
      WARN_EXPIRY_DAYS:        ${{ secrets.WARN_EXPIRY_DAYS }}
      WARN_LIMIT:              ${{ secrets.WARN_LIMIT }}
      FED_WARN_LIMIT:          ${{ secrets.FED_WARN_LIMIT }}
      WEBHOOK_URL:             ${{ secrets.WEBHOOK_URL }}
      WEBHOOK_SECRET:          ${{ secrets.WEBHOOK_SECRET }}
      PROOF_TIMEOUT_SECONDS:   ${{ secrets.PROOF_TIMEOUT_SECONDS }}
      APPEAL_TIMEOUT_SECONDS:  ${{ secrets.APPEAL_TIMEOUT_SECONDS }}
      ALBUM_DEBOUNCE_SECONDS:  ${{ secrets.ALBUM_DEBOUNCE_SECONDS }}
      MODULES_LOAD:            ${{ secrets.MODULES_LOAD }}
      MODULES_NO_LOAD:         ${{ secrets.MODULES_NO_LOAD }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Detect self-chain capability
        id: pat
        env:
          BOT_PAT: ${{ secrets.BOT_PAT }}
        run: |
          if [ -n "$BOT_PAT" ]; then
            echo "has_pat=true" >> "$GITHUB_OUTPUT"
            echo "PAT detected: self-chaining is enabled."
          else
            echo "has_pat=false" >> "$GITHUB_OUTPUT"
            echo "No BOT_PAT secret: relying on the cron schedule for restarts."
          fi

      - name: Run bot with watchdog and self-chain
        env:
          BOT_PAT: ${{ secrets.BOT_PAT }}
          HAS_PAT: ${{ steps.pat.outputs.has_pat }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail

          start_bot() {
            # * Background directly in this shell (no command substitution):
            # * $! stays a real child job, so kill -0 supervises the actual
            # * process and the shutdown block below can wait for its exit.
            # * (Capturing via BOT_PID="$(start_bot)" would run this in a
            # * subshell, leaving wait with a non-child PID that always fails.)
            uv run python -m tcbot > bot.log 2>&1 &
            BOT_PID=$!
          }

          # * Bounded graceful stop shared by the window-end path, the
          # * self-preempt break above, and the TERM/INT trap below.
          # * uv forwards the SIGTERM to the bot child (since 0.5.x,
          # * handled by PTB), so any cancellation gets the same 60 s wait
          # * as a normal window end instead of dying mid-write.
          stop_bot_gracefully() {
            if [ -n "${BOT_PID:-}" ] && kill -0 "$BOT_PID" 2>/dev/null; then
              echo "Stopping bot (PID $BOT_PID) gracefully..."
              kill "$BOT_PID" 2>/dev/null || true
              for _ in $(seq 1 30); do
                kill -0 "$BOT_PID" 2>/dev/null || break
                sleep 2
              done
              if kill -0 "$BOT_PID" 2>/dev/null; then
                echo "::warning::Bot did not exit within 60s; leaving it for runner teardown."
              fi
            fi
          }

          on_shutdown_signal() {
            stop_bot_gracefully
            echo "Bot stopped."
            exit 0
          }
          trap on_shutdown_signal TERM INT

          echo "Starting bot..."
          start_bot
          echo "Bot started with PID $BOT_PID"

          deadline=$(( $(date +%s) + WINDOW_SECONDS ))
          handover_at=$(( deadline - HANDOVER_LEAD ))
          handover_done=false
          restarts=0
          first_death=0
          loop_count=0
          stale_polls=0
          stop_reason="Window elapsed"
          # * SHA this run checked out (what is live right now) and the
          # * branch to watch, taken from this run's own ref.
          live_sha="$(git rev-parse HEAD 2>/dev/null || true)"
          watch_ref="${{ github.ref_name }}"

          # Supervisory loop
          while :; do
            now=$(date +%s)
            [ "$now" -ge "$deadline" ] && break

            # * Self-preempt on runtime pushes: the queued successor cannot
            # * clear the concurrency gate from inside its own job (its steps
            # * never start while this run holds the gate), so the LIVE run
            # * watches the branch itself. About every 2 min it compares its
            # * checkout SHA against the branch tip; on a runtime diff it
            # * breaks out below into the shared graceful stop, freeing the
            # * gate for the queued push run. Docs-only pushes only move the
            # * baseline. Three straight compare failures also break out:
            # * the queued run then starts instead of waiting out the window.
            loop_count=$((loop_count + 1))
            if [ $((loop_count % 4)) -eq 0 ] && [ -n "$live_sha" ] && [ -n "$watch_ref" ]; then
              remote_sha="$(gh api "repos/${{ github.repository }}/commits/${watch_ref}" -q .sha 2>/dev/null || true)"
              if [ -n "$remote_sha" ] && [ "$remote_sha" != "$live_sha" ]; then
                changed="$(gh api "repos/${{ github.repository }}/compare/${live_sha}...${remote_sha}" --paginate -q '.files[].filename' 2>/dev/null || true)"
                if [ -z "$changed" ]; then
                  stale_polls=$((stale_polls + 1))
                  echo "::warning::Self-preempt compare failed (${stale_polls}/3); retrying on the next poll."
                  if [ "$stale_polls" -ge 3 ]; then
                    stop_reason="Branch moved but the diff stayed unreadable"
                    break
                  fi
                elif printf '%s\n' "$changed" | grep -qE '^(tcbot/|i18n/|pyproject\.toml|uv\.lock|\.python-version|\.github/workflows/run-bot\.yml)'; then
                  stop_reason="Runtime changes detected upstream (${live_sha:0:7}..${remote_sha:0:7})"
                  break
                else
                  stale_polls=0
                  live_sha="$remote_sha"
                  echo "Only docs changed upstream; staying on this run."
                fi
              else
                stale_polls=0
              fi
            fi

            # Watchdog: restart the bot if the process has exited.
            if ! kill -0 "$BOT_PID" 2>/dev/null; then
              echo "::warning::Bot process $BOT_PID died. Restarting."
              # * Scrub credential-shaped strings before printing: workflow
              # * logs on a public repository are world-readable (same
              # * patterns as error_reporter.py redaction).
              tail -n 40 bot.log 2>/dev/null | sed -E -e 's/[0-9]{6,}:[A-Za-z0-9_-]{20,}/[REDACTED_TOKEN]/g' -e 's#://[^:@/ \t]*:[^@/ \t]*@#://[REDACTED]@#g' || true
              restarts=$((restarts + 1))
              [ "$first_death" = "0" ] && first_death=$now
              # * Fail-fast config (bad token/URI) would otherwise restart
              # * ~600x per window, hammering Telegram/Mongo. Five deaths
              # * within 10 minutes aborts; the */15 cron covers recovery.
              if [ "$restarts" -ge 5 ] && [ $((now - first_death)) -lt 600 ]; then
                echo "::error::Bot died 5 times within 10 minutes; giving up."
                exit 1
              fi
              # * Linear backoff (capped) so repeated crashes do not hot-loop.
              backoff=$((30 * restarts))
              [ "$backoff" -gt 300 ] && backoff=300
              sleep "$backoff"
              start_bot
              echo "Bot restarted with PID $BOT_PID"
            fi

            # Self-chain: queue the next run shortly before the window ends.
            # Retry the dispatch a few times so a single transient API failure
            # does not break the chain; the */15 cron is the last-resort backup.
            if [ "$handover_done" = "false" ] && [ "$now" -ge "$handover_at" ]; then
              if [ "$HAS_PAT" = "true" ]; then
                echo "Dispatching the next run (handover)..."
                dispatched=false
                for attempt in 1 2 3; do
                  if GH_TOKEN="$BOT_PAT" gh workflow run run-bot.yml --ref "main"; then
                    echo "Next run queued (attempt $attempt); it will start when this one stops."
                    dispatched=true
                    break
                  fi
                  echo "::warning::Handover dispatch attempt $attempt failed; retrying in 10s."
                  sleep 10
                done
                if [ "$dispatched" = "false" ]; then
                  echo "::warning::All handover dispatch attempts failed; the */15 cron will cover the restart."
                fi
              fi
              handover_done=true
            fi

            sleep 30
          done

          echo "${stop_reason}. Stopping bot gracefully..."
          stop_bot_gracefully
          echo "Bot stopped."

      - name: Scrub log of credentials
        if: always()
        run: |
          # * bot.log ships as a public artifact below; strip credential-shaped
          # * strings first (token id:hash, URI user:pass@ incl. password-only,
          # * same patterns as error_reporter.py). Message excerpts remain by
          # * design for crash debugging; see docs/operations/ci-cd.md.
          if [[ -f bot.log ]]; then
            sed -E -e 's/[0-9]{6,}:[A-Za-z0-9_-]{20,}/[REDACTED_TOKEN]/g' -e 's#://[^:@/ \t]*:[^@/ \t]*@#://[REDACTED]@#g' bot.log > bot-scrubbed.log
          fi

      - name: Detect crash in log
        if: always()
        run: |
          if [[ -f bot-scrubbed.log ]] && grep -qiE "(Traceback|^\w+Error:|CRITICAL)" bot-scrubbed.log; then
            echo "::warning::Crash signature found in bot.log (last 120 lines saved)."
            grep -n "" bot-scrubbed.log | tail -120 > crash_tail.log
          fi

      - name: Upload bot log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bot-log-${{ github.run_id }}
          path: |
            bot-scrubbed.log
            crash_tail.log
          retention-days: 7
          if-no-files-found: ignore
