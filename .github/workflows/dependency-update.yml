name: Dependency Updates

on:
  schedule:
    - cron: "0 4 * * 1"  # Weekly Monday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  models: read

jobs:
  update-dependencies:
    name: Update dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30

    concurrency:
      group: dependency-update
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Backup current lock
        run: cp uv.lock uv.lock.backup

      - name: Update dependencies
        id: update
        run: |
          echo "Updating dependencies..."
          uv lock --upgrade 2>&1 | tee update.log

          if diff -q uv.lock uv.lock.backup > /dev/null; then
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
            echo "No dependency updates available"
          else
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            echo "Dependencies updated!"
          fi

      - name: Show changes
        if: steps.update.outputs.has_updates == 'true'
        run: |
          echo "## Dependency Changes" >> changes.md
          echo "" >> changes.md
          echo "\`\`\`diff" >> changes.md
          diff -u uv.lock.backup uv.lock | head -100 >> changes.md || true
          echo "\`\`\`" >> changes.md

      - name: Install updated dependencies
        if: steps.update.outputs.has_updates == 'true'
        run: uv sync --frozen

      - name: Validate updated dependencies
        if: steps.update.outputs.has_updates == 'true'
        env:
          BOT_TOKEN: "000000:dummy-token-for-ci00000000000000000"
          MONGODB_URI: "mongodb://localhost:27017"
          OWNER_ID: "1"
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run python -c "import tcbot; print('import OK')"

      - name: Generate AI PR content (free via GitHub Models)
        id: ai-pr
        if: steps.update.outputs.has_updates == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIFF_SUMMARY="$(head -c 4000 changes.md | tr -d '\r' | sed 's/"/\\"/g' | tr '\n' ' ')"
          # * Free AI via GitHub Models (openai/gpt-4o-mini) using GITHUB_TOKEN
          # * - no extra secrets, no billing. Falls back to static text on failure.
          PROMPT="You are a senior Python/DevOps release expert. Write a professional Conventional Commit PR title and body for a dependency update. Title must be scoped Conventional Commit like 'chore(deps): ...' under 72 chars. Body must be 2-4 short bullets: what changed, why it matters, validation run, risk. No emojis, no em dashes, no tool names beyond the dep names. Diff summary: $DIFF_SUMMARY"

          RESPONSE="$(curl -s -w "\n%{http_code}" https://models.github.ai/inference/chat/completions \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"model\":\"openai/gpt-4o-mini\",\"messages\":[{\"role\":\"user\",\"content\":\"$PROMPT\"}],\"max_tokens\":400}" || true)"
          HTTP_CODE="$(echo "$RESPONSE" | tail -n1)"
          BODY_JSON="$(echo "$RESPONSE" | sed '$d')"

          if [ "$HTTP_CODE" = "200" ] && echo "$BODY_JSON" | grep -q '"choices"'; then
            AI_TEXT="$(echo "$BODY_JSON" | python3 -c "import sys,json;print(json.load(sys.stdin)['choices'][0]['message']['content'])" 2>/dev/null | head -c 3000)"
            # * Split first line as title, rest as body
            AI_TITLE="$(echo "$AI_TEXT" | head -n1 | sed 's/^#* *//' | cut -c1-72)"
            AI_BODY="$(echo "$AI_TEXT" | tail -n +2)"
            [ -z "$AI_TITLE" ] && AI_TITLE="chore(deps): update dependencies"
            [ -z "$AI_BODY" ] && AI_BODY="Automated dependency update. Diff in changes.md."
          else
            echo "AI generation failed or not available (HTTP $HTTP_CODE), using fallback."
            AI_TITLE="chore(deps): update dependencies"
            AI_BODY="Automated dependency update.
          "
          fi

          # * Sanitize: no em dashes, keep plain hyphens
          AI_TITLE="$(echo "$AI_TITLE" | tr '—' '-')"
          AI_BODY="$(echo "$AI_BODY" | tr '—' '-')"

          echo "title=$AI_TITLE" >> "$GITHUB_OUTPUT"
          {
            echo "body<<EOF"
            echo "$AI_BODY"
            echo ""
            echo "### Changes"
            cat changes.md
            echo ""
            echo "### Validation"
            echo "- ruff format --check, ruff check, import tcbot passed"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "AI title: $AI_TITLE"

      - name: Create PR
        if: steps.update.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_PAT: ${{ secrets.BOT_PAT }}
          AI_TITLE: ${{ steps.ai-pr.outputs.title }}
          AI_BODY: ${{ steps.ai-pr.outputs.body }}
        run: |
          BRANCH="deps/auto-update-$(date +%Y%m%d)"
          if git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
            BRANCH="${BRANCH}-run${GITHUB_RUN_NUMBER}"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add uv.lock
          # * Use AI title when available, fallback to chore
          COMMIT_TITLE="${AI_TITLE:-chore: Update dependencies}"
          git commit -m "$COMMIT_TITLE

          Auto-updated by GitHub Actions

          $(cat changes.md)"

          git push origin "$BRANCH"

          # * Prefer AI body when available
          PR_BODY="${AI_BODY:-$(cat <<EOF
          ## Automated Dependency Update

          This PR updates project dependencies to their latest compatible versions.

          ### Changes
          $(cat changes.md)
          EOF
          )}"

          create_pr() {
            gh pr create \
              --title "$COMMIT_TITLE" \
              --body "$PR_BODY" \
              --label "dependencies" \
              --base main \
              --head "$BRANCH"
          }

          if create_pr; then
            exit 0
          fi

          # * github.token cannot create PRs when the repository toggle
          # * ("Allow GitHub Actions to create and approve pull requests")
          # * is off. Retry once with BOT_PAT, the personal token the
          # * runner already documents as recommended for self-chaining.
          if [ -n "${BOT_PAT:-}" ] && GH_TOKEN="$BOT_PAT" create_pr; then
            echo "::notice::PR created with the BOT_PAT fallback. Enable the workflow-permissions toggle so github.token works next time."
            exit 0
          fi

          # * Both attempts failed: fail loud but point at the exact
          # * toggle; the branch above is already pushed, so flipping it
          # * and re-running (or opening the PR manually) recovers.
          echo "::error::gh pr create failed. If the log says 'GitHub Actions is not permitted to create or approve pull requests', enable Settings → Actions → General → Workflow permissions → 'Allow GitHub Actions to create and approve pull requests', then re-run (branch $BRANCH is already pushed) or open the PR manually."
          exit 1

      - name: Telegram notification
        if: always() && steps.update.outputs.has_updates == 'true'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
        run: |
          python - << 'PYEOF'
          import json, os, sys, urllib.request

          token = os.getenv("BOT_TOKEN", "")
          owner_id = os.getenv("OWNER_ID", "")

          if not token or not owner_id or token.startswith("test:"):
              sys.exit(0)

          text = (
              "<b>Dependency Update</b>\n\n"
              "Dependencies updated\n"
              "Result: PR created\n\n"
              f'<a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View workflow</a>'
          )

          payload = json.dumps({
              "chat_id": owner_id,
              "text": text,
              "parse_mode": "HTML",
              "disable_web_page_preview": True,
          }).encode()

          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=payload,
              headers={"Content-Type": "application/json"},
          )
          try:
              urllib.request.urlopen(req, timeout=15)
          except Exception as exc:
              print(f"Notification failed: {exc}", file=sys.stderr)
          PYEOF
