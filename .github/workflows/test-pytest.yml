name: Test (Pytest)

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Pytest suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      BOT_TOKEN: "000000:dummy-token-for-lint000000000000000"
      DATABASE_URL: "postgresql://tcbot:tcbot@127.0.0.1:5432/tcbot"
      OWNER_ID: "1"
      # * The database-backed tests run against this server. Without it
      # * they skip, so the suite still passes without a database.
      TCBOT_TEST_DATABASE_URL: "postgresql://tcbot:tcbot@127.0.0.1:5432/tcbot"
      # * The cache tests run against this server. Without it they skip.
      # * The variable is test-only on purpose: the runtime REDIS_URL
      # * names the deployment cache, and a suite that reaches it would
      # * write, read, and delete live cache entries.
      TCBOT_TEST_REDIS_URL: "redis://127.0.0.1:6379/0"
      # * Validate the committed lock everywhere, so the tested dependency
      # * graph is the same one the frozen production image installs.
      UV_LOCKED: "1"

    services:
      postgres:
        image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
        env:
          POSTGRES_USER: tcbot
          POSTGRES_PASSWORD: tcbot
          POSTGRES_DB: tcbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tcbot -d tcbot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run PostgreSQL integration tests
        run: uv run pytest tests/ -q -m postgres --cov=tcbot --cov-branch --cov-report=

      - name: Run remaining tests
        run: uv run pytest tests/ -q -m "not postgres" -n auto --cov=tcbot --cov-branch --cov-append --cov-report=term-missing --cov-report=html

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: htmlcov/
        if-no-files-found: ignore

  observability:
    name: Production observability extra
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      BOT_TOKEN: "000000:dummy-token-for-lint000000000000000"
      DATABASE_URL: "postgresql://tcbot:tcbot@127.0.0.1:5432/tcbot"
      OWNER_ID: "1"
      PROOFS: "-1000000000001"
      SENTRY_DSN: "https://public@example.invalid/1"
      UV_LOCKED: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # * The extra is installed only on production paths. A broken SDK pin
      # * or integration keyword would otherwise surface at deploy time.
      - name: Install the observability extra
        run: uv sync --locked --extra observability

      - name: Smoke-test the real monitoring dependencies
        run: |
          uv run --locked --extra observability python -c "
          import sentry_sdk
          from sentry_sdk.integrations.loguru import LoguruIntegration
          LoguruIntegration(event_level=40)
          import tcbot.alive as alive
          import tcbot.__main__ as app
          app._init_sentry()
          assert sentry_sdk.get_client().dsn is not None
          assert alive._METRICS_RESPONSE is not None
          print('observability extra ready')
          "
