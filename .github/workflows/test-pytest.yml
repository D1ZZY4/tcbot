name: Test (Pytest)

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Pytest suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      BOT_TOKEN: "000000:dummy-token-for-lint000000000000000"
      DATABASE_URL: "postgresql://tcbot:tcbot@127.0.0.1:5432/tcbot"
      OWNER_ID: "1"
      # * The database-backed tests run against this server. Without it
      # * they skip, so the suite still passes without a database.
      TCBOT_TEST_DATABASE_URL: "postgresql://tcbot:tcbot@127.0.0.1:5432/tcbot"
      # * The cache tests run against this server. Without it they skip.
      REDIS_URL: "redis://127.0.0.1:6379/0"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tcbot
          POSTGRES_PASSWORD: tcbot
          POSTGRES_DB: tcbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tcbot -d tcbot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest tests/ -q -n auto --cov=tcbot --cov-branch --cov-report=term-missing --cov-report=html

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: htmlcov/
        if-no-files-found: ignore
